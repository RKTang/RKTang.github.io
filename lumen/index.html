<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen | Photo Journal Builder</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header class="page-header">
        <h1>Lumen</h1>
        <p>Create your own metadata-aware photo journal.</p>
        <div class="header-actions">
            <a class="home-link" href="../index.html">Back to Portfolio</a>
            <button id="sign-in-btn" type="button">Sign in with Google</button>
            <button id="sign-out-btn" type="button" hidden>Sign out</button>
        </div>
        <p id="auth-status" class="auth-status">Checking authentication...</p>
    </header>

    <main class="layout">
        <section class="panel">
            <h2>Your Albums</h2>
            <form id="new-album-form" class="stack" hidden>
                <label>
                    Album title
                    <input id="new-album-title" type="text" maxlength="120" placeholder="Summer Memories" required>
                </label>
                <label>
                    Visibility
                    <select id="new-album-visibility">
                        <option value="private">Private</option>
                        <option value="public">Public</option>
                    </select>
                </label>
                <button type="submit">Create album</button>
            </form>
            <p id="album-list-empty" class="muted">Sign in to create and manage albums.</p>
            <div id="album-list" class="album-list"></div>
        </section>

        <section class="panel">
            <div class="panel-heading">
                <h2 id="active-album-title">Open an album</h2>
                <span id="active-album-visibility" class="pill" hidden></span>
            </div>

            <div id="album-controls" class="stack" hidden>
                <label>
                    Album visibility
                    <select id="album-visibility-select">
                        <option value="private">Private</option>
                        <option value="public">Public</option>
                    </select>
                </label>
                <button id="save-album-settings" type="button">Save album settings</button>
                <p class="muted" id="share-url-text"></p>
                <label>
                    Upload photos (metadata auto-filled when available)
                    <input id="photo-upload-input" type="file" multiple accept="image/*">
                </label>
            </div>

            <p id="album-view-state" class="muted">
                Select an album to view entries, or open a shared public link.
            </p>

            <div id="entry-grid" class="entry-grid"></div>
        </section>
    </main>

    <template id="entry-template">
        <article class="entry-card">
            <img class="entry-image" alt="">
            <div class="entry-fields stack">
                <label>
                    Story
                    <textarea class="entry-story" rows="3"></textarea>
                </label>
                <label>
                    Location
                    <input class="entry-location" type="text">
                </label>
                <label>
                    Date
                    <input class="entry-date" type="text">
                </label>
                <div class="entry-meta muted"></div>
                <div class="entry-actions">
                    <button class="entry-save" type="button">Save</button>
                    <button class="entry-delete" type="button">Delete</button>
                </div>
            </div>
        </article>
    </template>

    <script src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
