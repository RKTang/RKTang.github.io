<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Journal | Richard Tang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="creative-style.css">
</head>
<body>
    <header class="page-header">
        <h1>Creative Polaroid Journal</h1>
        <p>Click any polaroid to open the full image and process story.</p>
        <a class="home-link" href="../index.html">Back to Portfolio</a>
    </header>

    <main class="polaroid-grid" aria-label="Creative Journal Gallery">
        <button class="polaroid-card" type="button" data-full-src="photos/photo-02.png" data-alt="Creative journal photo 2" data-title="Polaroid 02" data-story="I framed this one to capture the contrast between soft sky and hard structure." data-location="Portland, OR" data-date="Apr 2026">
            <img src="photos/photo-02.png" alt="Creative journal photo 2">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-03.png" data-alt="Creative journal photo 3" data-title="Polaroid 03" data-story="A quick handheld capture where texture and shadows did all the storytelling." data-location="Vancouver, BC" data-date="Mar 2026">
            <img src="photos/photo-03.png" alt="Creative journal photo 3">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-04.png" data-alt="Creative journal photo 4" data-title="Polaroid 04" data-story="This frame came from waiting for a quiet moment with no people in view." data-location="San Francisco, CA" data-date="Mar 2026">
            <img src="photos/photo-04.png" alt="Creative journal photo 4">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-05.png" data-alt="Creative journal photo 5" data-title="Polaroid 05" data-story="I leaned into cool tones here to emphasize distance and atmosphere." data-location="Banff, AB" data-date="Feb 2026">
            <img src="photos/photo-05.png" alt="Creative journal photo 5">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-06.png" data-alt="Creative journal photo 6" data-title="Polaroid 06" data-story="This shot was about symmetry first, subject second." data-location="Chicago, IL" data-date="Feb 2026">
            <img src="photos/photo-06.png" alt="Creative journal photo 6">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-07.png" data-alt="Creative journal photo 7" data-title="Polaroid 07" data-story="I kept the composition simple and let the lighting carry the mood." data-location="New York, NY" data-date="Jan 2026">
            <img src="photos/photo-07.png" alt="Creative journal photo 7">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-08.png" data-alt="Creative journal photo 8" data-title="Polaroid 08" data-story="A windy evening gave this frame the motion blur I wanted." data-location="Los Angeles, CA" data-date="Jan 2026">
            <img src="photos/photo-08.png" alt="Creative journal photo 8">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-09.png" data-alt="Creative journal photo 9" data-title="Polaroid 09" data-story="I exposed for highlights to preserve color in the brightest parts." data-location="Tokyo, JP" data-date="Dec 2025">
            <img src="photos/photo-09.png" alt="Creative journal photo 9">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-10.png" data-alt="Creative journal photo 10" data-title="Polaroid 10" data-story="This frame was a reminder to slow down and watch edges before shooting." data-location="Kyoto, JP" data-date="Dec 2025">
            <img src="photos/photo-10.png" alt="Creative journal photo 10">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-11.png" data-alt="Creative journal photo 11" data-title="Polaroid 11" data-story="I captured this one quickly before the weather changed." data-location="Reykjavik, IS" data-date="Nov 2025">
            <img src="photos/photo-11.png" alt="Creative journal photo 11">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-12.png" data-alt="Creative journal photo 12" data-title="Polaroid 12" data-story="A low-angle perspective helped make this scene feel more cinematic." data-location="London, UK" data-date="Nov 2025">
            <img src="photos/photo-12.png" alt="Creative journal photo 12">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-13.png" data-alt="Creative journal photo 13" data-title="Polaroid 13" data-story="I built this composition around the leading lines in the architecture." data-location="Paris, FR" data-date="Oct 2025">
            <img src="photos/photo-13.png" alt="Creative journal photo 13">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-14.png" data-alt="Creative journal photo 14" data-title="Polaroid 14" data-story="This was my favorite from the set because the colors balanced naturally." data-location="Rome, IT" data-date="Oct 2025">
            <img src="photos/photo-14.png" alt="Creative journal photo 14">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-15.png" data-alt="Creative journal photo 15" data-title="Polaroid 15" data-story="I reframed this three times before this final version felt right." data-location="Amsterdam, NL" data-date="Sep 2025">
            <img src="photos/photo-15.png" alt="Creative journal photo 15">
        </button>
        <button class="polaroid-card" type="button" data-full-src="photos/photo-16.png" data-alt="Creative journal photo 16" data-title="Polaroid 16" data-story="A soft ending frame for the series, focused on mood over detail." data-location="Copenhagen, DK" data-date="Sep 2025">
            <img src="photos/photo-16.png" alt="Creative journal photo 16">
        </button>
    </main>

    <dialog id="polaroid-modal" aria-labelledby="modal-title">
        <article id="modal-card" class="modal-content">
            <h2 id="modal-title"></h2>
            <div class="modal-flip">
                <section class="modal-face modal-front">
                    <div class="modal-photo">
                        <img id="modal-image" src="" alt="">
                    </div>
                </section>
                <section class="modal-face modal-back" aria-label="Photo details">
                    <h3 id="modal-back-title"></h3>
                    <p id="modal-story"></p>
                    <p id="modal-location"></p>
                    <p id="modal-date"></p>
                </section>
            </div>
        </article>
    </dialog>

    <script src="creative-script.js"></script>
</body>
</html>
